appId: com.lynksavvy.trustcapture
name: "Photo Capture with Voice Note"
---
- launchApp

- runFlow:
    when:
      visible: "Background Location Access"
    commands:
      - tapOn: "Not Now"

# Navigate to Quick Capture
- tapOn: "Quick Capture"
- tapOn: "Accident"

# Wait for camera
- extendedWaitUntil:
    visible: "PHOTO"
    timeout: 35000

# Take photo
- tapOn:
    point: "50%,85%"

# Wait for review screen
- extendedWaitUntil:
    visible: "Review Photo"
    timeout: 15000

# Scroll down to voice note section
- scrollUntilVisible:
    element: "Voice Note"
    direction: DOWN

# Tap Record Voice Note button
- tapOn: "Record Voice Note"

# Grant audio permission if prompted
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

# Should show recording indicator
- extendedWaitUntil:
    visible: "Recording"
    timeout: 5000

# Wait 3 seconds
- swipe:
    direction: UP
    duration: 3000

# Stop recording
- tapOn: "Stop"

# Should show "Voice note recorded"
- assertVisible: "Voice note recorded"

# Upload
- scrollUntilVisible:
    element: "Upload"
    direction: DOWN
- tapOn: "Upload"

# Instant success
- extendedWaitUntil:
    visible: "uploaded successfully"
    timeout: 5000
