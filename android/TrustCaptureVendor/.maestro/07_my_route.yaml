appId: com.lynksavvy.trustcapture
name: "My Route Today"
---
- launchApp

- runFlow:
    when:
      visible: "Background Location Access"
    commands:
      - tapOn: "Not Now"

# Tap My Route Today (only visible when tracking enabled)
- runFlow:
    when:
      visible: "My Route Today"
    commands:
      - tapOn: "My Route Today"
      - extendedWaitUntil:
          visible: "Today's Tracking Stats"
          timeout: 5000
      - assertVisible: "Points"
      - assertVisible: "Duration"
      - assertVisible: "Distance"
      - assertVisible: "Sync Now"
      # Go back
      - tapOn:
          point: "5%,5%"
