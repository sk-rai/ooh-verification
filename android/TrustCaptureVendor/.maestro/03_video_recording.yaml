appId: com.lynksavvy.trustcapture
name: "Quick Capture - Video Recording"
---
- launchApp

# Handle privacy consent if first launch
- runFlow:
    when:
      visible: "Privacy & Data Collection"
    commands:
      - scrollUntilVisible:
          element: "Location Data Collection"
          direction: DOWN
      - tapOn: "Location Data Collection"
      - tapOn: "Accept & Continue"

- runFlow:
    when:
      visible: "Background Location Access"
    commands:
      - tapOn: "Not Now"

# Navigate to Quick Capture
- tapOn: "Quick Capture"
- tapOn: "Damage"

# Wait for camera
- extendedWaitUntil:
    visible: "PHOTO"
    timeout: 35000

# Switch to video mode (toggle button on the left)
- tapOn:
    point: "25%,85%"

# Should see VIDEO label
- assertVisible: "VIDEO"

# Start recording (red record button in center)
- tapOn:
    point: "50%,85%"

# Should see recording timer
- extendedWaitUntil:
    visible: "REC"
    timeout: 5000

# Wait 5 seconds for recording
- swipe:
    direction: UP
    duration: 5000

# Stop recording (tap stop button in center)
- tapOn:
    point: "50%,85%"

# Should transition to review screen
- extendedWaitUntil:
    visible: "Review Video"
    timeout: 15000

# Should show video info
- assertVisible: "Video"

# Upload
- scrollUntilVisible:
    element: "Upload"
    direction: DOWN
- tapOn: "Upload"

# Instant success (save-first)
- extendedWaitUntil:
    visible: "uploaded successfully"
    timeout: 5000

