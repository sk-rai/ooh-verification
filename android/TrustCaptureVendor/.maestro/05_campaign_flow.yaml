appId: com.lynksavvy.trustcapture
name: "Campaign Flow - Assigned Location"
---
- launchApp

- runFlow:
    when:
      visible: "Background Location Access"
    commands:
      - tapOn: "Not Now"

# Tap My Campaigns
- tapOn: "My Campaigns"

# Should see campaigns list (wait for network fetch)
- extendedWaitUntil:
    visible: "CAM-"
    timeout: 15000

# Tap first campaign item
- tapOn:
    index: 0

# Should see locations list (or camera directly)
- extendedWaitUntil:
    visible:
      anyOf:
        - "GPS"
        - "Location"
    timeout: 35000

# If on locations screen, tap first location
- runFlow:
    when:
      visible: "Location"
    commands:
      - tapOn:
          index: 0

# Wait for camera
- extendedWaitUntil:
    visible: "PHOTO"
    timeout: 35000

# Take photo
- tapOn:
    point: "50%,85%"

# Wait for review
- extendedWaitUntil:
    visible: "Review Photo"
    timeout: 15000

# Upload
- scrollUntilVisible:
    element: "Upload"
    direction: DOWN
- tapOn: "Upload"

# Instant success
- extendedWaitUntil:
    visible: "uploaded successfully"
    timeout: 5000
