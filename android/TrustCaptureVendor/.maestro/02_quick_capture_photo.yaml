appId: com.lynksavvy.trustcapture
name: "Quick Capture - Photo with Text Note"
---
- launchApp

# Handle privacy consent if first launch
- runFlow:
    when:
      visible: "Privacy & Data Collection"
    commands:
      - tapOn: "Location Data Collection"
      - tapOn: "Accept & Continue"

# Handle any permission dialogs
- runFlow:
    when:
      visible: "Background Location Access"
    commands:
      - tapOn: "Not Now"

# Tap Quick Capture
- tapOn: "Quick Capture"

# Category picker should appear
- assertVisible: "Quick Capture"

# Select "Inspection" category
- tapOn: "Inspection"

# Camera screen should open — wait for GPS
- extendedWaitUntil:
    visible: "PHOTO"
    timeout: 35000

# Grant camera/location permissions if prompted
- runFlow:
    when:
      visible: "Grant Permissions"
    commands:
      - tapOn: "Grant Permissions"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
      - runFlow:
          when:
            visible: "While using the app"
          commands:
            - tapOn: "While using the app"

# Take a photo (tap the capture button at bottom center)
- tapOn:
    point: "50%,85%"

# Wait for review screen
- extendedWaitUntil:
    visible: "Review Photo"
    timeout: 15000

# Should see review screen with metadata
- assertVisible: "Capture Details"

# Type a text note (scroll down to find it)
- scrollUntilVisible:
    element: "Add observations"
    direction: DOWN
- tapOn: "Add observations"
- inputText: "Maestro test note"

# Tap Upload
- scrollUntilVisible:
    element: "Upload"
    direction: DOWN
- tapOn: "Upload"

# Upload is now instant (save-first architecture)
- extendedWaitUntil:
    visible: "uploaded successfully"
    timeout: 5000
