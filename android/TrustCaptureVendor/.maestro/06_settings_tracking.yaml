appId: com.lynksavvy.trustcapture
name: "Settings - Tracking Toggle"
---
- launchApp

# Handle privacy consent if first launch
- runFlow:
    when:
      visible: "Privacy & Data Collection"
    commands:
      - scrollUntilVisible:
          element: "Location Data Collection"
          direction: DOWN
      - tapOn: "Location Data Collection"
      - tapOn: "Accept & Continue"

- runFlow:
    when:
      visible: "Background Location Access"
    commands:
      - tapOn: "Not Now"

# Navigate to Settings (gear icon in top-right)
- tapOn:
    point: "85%,5%"

# Verify Settings screen
- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000

# Check Location Tracking section
- assertVisible:
    text: "Location Tracking"
    optional: true

# Check tracking toggle
- assertVisible:
    text: "Enable location tracking"
    optional: true

# Verify Account section
- assertVisible: "Account"

# Verify Device Security section
- scrollUntilVisible:
    element: "Device Security"
    direction: DOWN
- assertVisible: "Device Security"

# Verify About section
- scrollUntilVisible:
    element: "About"
    direction: DOWN
- assertVisible: "App Version"

# Go back (arrow in top-left)
- tapOn:
    point: "5%,5%"

