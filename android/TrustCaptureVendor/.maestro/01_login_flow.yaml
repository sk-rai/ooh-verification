appId: com.lynksavvy.trustcapture
name: "Login Flow - OTP"
---
- launchApp

# Privacy consent screen appears on first launch
- runFlow:
    when:
      visible: "Privacy & Data Collection"
    commands:
      - scrollUntilVisible:
          element: "Location Data Collection"
          direction: DOWN
      - tapOn: "Location Data Collection"
      - tapOn: "Accept & Continue"

# Should see login screen
- assertVisible: "TrustCapture"
- assertVisible: "Vendor Photo Capture"

# Enter Vendor ID
- tapOn: "Vendor ID"
- inputText: "9BIZMV"

# Enter Phone Number
- tapOn: "Phone Number"
- inputText: "9876543210"

# Tap Request OTP
- tapOn: "Request OTP"

# Wait for OTP screen
- extendedWaitUntil:
    visible: "Enter Verification Code"
    timeout: 10000

# Enter OTP
- tapOn: "6-digit OTP"
- inputText: "123456"

# Tap Verify
- tapOn: "Verify & Login"

# Should land on Home screen
- extendedWaitUntil:
    visible: "What would you like to do?"
    timeout: 10000

# Handle background location permission dialog if it appears
- runFlow:
    when:
      visible: "Background Location Access"
    commands:
      - tapOn: "Not Now"
